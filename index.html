<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>安装摩岛手机伴侣</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#faf9f7;color:#24241f;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:28px}
    main{width:min(100%,390px)}.brand{font-size:16px;margin-bottom:48px;font-weight:600}.brand span{font-weight:400;color:#85857d}.mark{width:58px;height:58px;border-radius:16px;background:#e6eee8;color:#35624b;display:grid;place-items:center;font-size:27px;margin-bottom:24px}
    h1{font-size:26px;letter-spacing:-.5px;margin:0 0 14px}p{font-size:14px;line-height:1.8;color:#77776e;margin:0 0 22px}.meta{font-size:12px;min-height:20px;margin-bottom:24px;color:#88887f}
    button,a.action{display:block;width:100%;border:0;background:#345c48;color:white;border-radius:10px;text-align:center;padding:15px 18px;font:600 15px system-ui;cursor:pointer;text-decoration:none;margin:12px 0}button:disabled{opacity:.55;cursor:wait}.secondary{background:#ecece7!important;color:#42423c!important}
    [hidden]{display:none!important}progress{width:100%;height:6px;accent-color:#345c48;margin:0 0 24px}.hint{font-size:12px;margin-top:24px}.status{color:#35624b}
  </style>
</head>
<body>
  <main>
    <div class="brand">modcode <span> / 手机伴侣</span></div>
    <div class="mark" aria-hidden="true">↓</div>
    <h1 id="title">正在准备安装</h1>
    <p id="status" role="status" aria-live="polite">正在连接你的电脑，请保持电脑开启。</p>
    <div id="meta" class="meta"></div>
    <progress id="progress" hidden value="0" max="100" aria-label="安装包下载进度"></progress>
    <button id="download" hidden>下载并安装</button>
    <a id="open" class="action secondary" hidden>已安装，打开并配对</a>
    <button id="retry" class="secondary" hidden>重试连接</button>
    <p id="hint" class="hint">支持手机 5G 或 Wi-Fi，请保持电脑开启。首次安装可能需要允许浏览器安装应用。安装完成后，点击系统的“打开”。</p>
  </main>
  <script src="crypto.js"></script>
  <script src="p2p.js"></script>
  <script src="install.js"></script>
</body>
</html>
